[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dumm-e"
version = "0.1.0"
description = "A 220M-parameter decoder-only Transformer with built-in synthetic conscience (value alignment and safety head)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DUMM-E Contributors"}
]
dependencies = [
    "torch>=2.0.0",
    "tokenizers>=0.13.0",
    "pyyaml>=6.0",
    "numpy>=1.20.0",
    "tqdm>=4.60.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

