# Pretraining Configuration
model_config: "configs/model_220m.yaml"
tokenizer_path: "artifacts/tokenizer/tokenizer.json"

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  max_seq_len: 2048
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 2000
  max_steps: 100000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  precision: "bfloat16"           # "bfloat16", "float16", or "float32"
  gradient_checkpointing: true

logging:
  log_interval: 10
  save_interval: 1000
  checkpoint_dir: "checkpoints/pretrain"

